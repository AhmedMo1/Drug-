<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دليل الأدوية المصري - Egyptian Drug Database</title>
    <meta name="description" content="قاعدة بيانات الأدوية المصرية المحدثة (26,500+ دواء) مع بدائل ومثائل الأدوية، أدلة أدوية البالغين (Adult Monographs)، التفاعلات الدوائية، وتنبيهات الأمان المعتمدة." />
    <meta property="og:title" content="دليل الأدوية المصري - Egyptian Drug Database" />
    <meta property="og:description" content="قاعدة بيانات الأدوية المصرية المحدثة (26,500+ دواء) مع بدائل ومثائل الأدوية، أدلة أدوية البالغين (Adult Monographs)، التفاعلات الدوائية، وتنبيهات الأمان المعتمدة." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      try {
        const savedTheme = localStorage.getItem('egypt_drugs_dark');
        const isDark = savedTheme === 'true' || (savedTheme === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-['Cairo',sans-serif] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
